<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1105 610" width="1105" height="610" font-family="'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="52%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#131c46"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#5ec8f8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ec8f8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8fe3ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5ec8f8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#3b5bdb"/>
    </linearGradient>

    <linearGradient id="borderGrad" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ec8f8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8fe3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5ec8f8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1105" height="610" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1105" height="610" fill="url(#bg)"/>
    <rect x="0" y="0" width="1105" height="610" fill="url(#grid)"/>

    <!-- breathing glow blobs -->
    <circle cx="960" cy="90" r="220" fill="url(#glowBlue)">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="560" r="200" fill="url(#glowGold)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="140" fill="url(#glowBlue)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#bfe6ff">
      <circle cx="850" cy="40" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="70" r="1.3"><animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="45" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1055" cy="95" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="965" cy="140" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="480" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="530" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="35" cy="580" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="1035" cy="560" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- corner circuit brackets -->
    <g stroke="#5ec8f8" stroke-width="1.4" opacity="0.4" fill="none">
      <path d="M 935 150 L 980 150 L 980 180"/>
      <path d="M 1060 150 L 1018 150 L 1018 174"/>
      <path d="M 45 500 L 45 545 L 88 545"/>
      <path d="M 1060 545 L 1002 545 L 1002 512"/>
    </g>

    <!-- Header -->
    <g transform="translate(40,26)">
      <circle cx="27" cy="27" r="30" fill="none" stroke="#5ec8f8" stroke-opacity="0.35" stroke-width="1.4">
        <animate attributeName="r" values="27;32;27" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      <rect x="2" y="2" width="50" height="50" rx="13" fill="url(#iconGrad)"/>
      <circle cx="27" cy="21" r="8" fill="#ffffff"/>
      <path d="M 10 44 C 10 30 44 30 44 44 Z" fill="#ffffff"/>

      <text x="70" y="30" font-size="30" font-weight="700" letter-spacing="2" fill="#f4f7ff" filter="url(#softGlow)">ABOUT_ME</text>
      <rect x="262" y="6" width="10" height="26" fill="#8fe3ff">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="70" y="55" font-size="13.5" fill="#f5a623" opacity="0.9">Very Large Scale Integration &#183; Verilog &#183; Digital Electronics &#183; C Programming</text>
    </g>

    <!-- animated scan line -->
    <rect x="0" y="94" width="1105" height="1.4" fill="#5ec8f8" opacity="0.12"/>
    <rect x="-250" y="93.2" width="250" height="3" fill="url(#scan)">
      <animate attributeName="x" values="-250;1105" dur="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- terminal title bar -->
    <g transform="translate(0,104)">
      <rect x="0" y="0" width="1105" height="44" fill="#0a0e27" opacity="0.55"/>
      <circle cx="56" cy="22" r="7" fill="#ff5f57"/>
      <circle cx="81" cy="22" r="7" fill="#febc2e"/>
      <circle cx="106" cy="22" r="7" fill="#28c840"/>
      <text x="552" y="27" font-size="13.5" fill="#8894b8" text-anchor="middle">vineeth@system ~ /about-me</text>
    </g>

    <!-- content rows -->
    <g font-size="19">
      <!-- row separators -->
      <g stroke="#5ec8f8" stroke-opacity="0.08" stroke-width="1">
        <line x1="75" y1="217" x2="1030" y2="217"/>
        <line x1="75" y1="271" x2="1030" y2="271"/>
        <line x1="75" y1="325" x2="1030" y2="325"/>
        <line x1="75" y1="379" x2="1030" y2="379"/>
        <line x1="75" y1="433" x2="1030" y2="433"/>
        <line x1="75" y1="487" x2="1030" y2="487"/>
      </g>

      <!-- NAME -->
      <g transform="translate(75,178)" stroke="#5ec8f8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="5.2" r="3"/>
        <path d="M2 15c0-4 4-6 6-6s6 2 6 6"/>
      </g>
      <text x="104" y="196" font-weight="700" fill="#5ec8f8">NAME</text>
      <text x="345" y="196" fill="#5ec8f8">:</text>
      <text x="365" y="196" fill="#eef1fb">Vineeth Kumar J R</text>

      <!-- ROLE -->
      <g transform="translate(75,232)" stroke="#5ec8f8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3 L15 6.2 L8 9.4 L1 6.2 Z"/>
        <path d="M4.3 7.7 V11 C4.3 12.4 6 13.4 8 13.4 C10 13.4 11.7 12.4 11.7 11 V7.7"/>
      </g>
      <text x="104" y="250" font-weight="700" fill="#5ec8f8">ROLE</text>
      <text x="345" y="250" fill="#5ec8f8">:</text>
      <text x="365" y="250" fill="#eef1fb">ECE Undergraduate | Learning VLSI</text>

      <!-- INSTITUTION -->
      <g transform="translate(75,286)" stroke="#5ec8f8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3.5" width="10" height="11.5"/>
        <g fill="#5ec8f8" stroke="none">
          <circle cx="6" cy="6.6" r="0.7"/>
          <circle cx="10" cy="6.6" r="0.7"/>
          <circle cx="6" cy="9.6" r="0.7"/>
          <circle cx="10" cy="9.6" r="0.7"/>
        </g>
      </g>
      <text x="104" y="304" font-weight="700" fill="#5ec8f8">INSTITUTION</text>
      <text x="345" y="304" fill="#5ec8f8">:</text>
      <text x="365" y="304" fill="#eef1fb">Vidyavardhaka College of Engineering</text>

      <!-- STATUS -->
      <g transform="translate(75,340)" fill="#5ec8f8">
        <rect x="1.5" y="9" width="2.6" height="6" rx="1"/>
        <rect x="6" y="6" width="2.6" height="9" rx="1"/>
        <rect x="10.5" y="2.5" width="2.6" height="12.5" rx="1"/>
      </g>
      <text x="104" y="358" font-weight="700" fill="#5ec8f8">STATUS</text>
      <text x="345" y="358" fill="#5ec8f8">:</text>
      <circle cx="372" cy="353" r="4.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="385" y="358" font-weight="700" fill="#34d399">ONLINE</text>
      <text x="468" y="358" fill="#8894b8">|</text>
      <text x="483" y="358" fill="#eef1fb">Continuously learning and innovating</text>

      <!-- INTERESTS -->
      <g transform="translate(75,394)" stroke="#5ec8f8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="6.5" r="4.3"/>
        <line x1="6" y1="12.3" x2="10" y2="12.3"/>
        <line x1="6.5" y1="14.6" x2="9.5" y2="14.6"/>
      </g>
      <text x="104" y="412" font-weight="700" fill="#5ec8f8">INTERESTS</text>
      <text x="345" y="412" fill="#5ec8f8">:</text>
      <text x="365" y="412" fill="#eef1fb">IoT &#183; Embedded Systems</text>

      <!-- HARDWARE -->
      <g transform="translate(75,448)" stroke="#5ec8f8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="8" height="8" rx="1.2"/>
        <line x1="6" y1="1" x2="6" y2="4"/>
        <line x1="10" y1="1" x2="10" y2="4"/>
        <line x1="6" y1="12" x2="6" y2="15"/>
        <line x1="10" y1="12" x2="10" y2="15"/>
        <line x1="1" y1="6" x2="4" y2="6"/>
        <line x1="1" y1="10" x2="4" y2="10"/>
        <line x1="12" y1="6" x2="15" y2="6"/>
        <line x1="12" y1="10" x2="15" y2="10"/>
      </g>
      <text x="104" y="466" font-weight="700" fill="#5ec8f8">HARDWARE</text>
      <text x="345" y="466" fill="#5ec8f8">:</text>
      <text x="365" y="466" fill="#eef1fb">Arduino Uno &#183; ESP32</text>

      <!-- MISSION -->
      <g transform="translate(75,502)" stroke="#f5a623" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6.2"/>
        <circle cx="8" cy="8" r="3.4"/>
        <circle cx="8" cy="8" r="0.9" fill="#f5a623" stroke="none"/>
      </g>
      <text x="104" y="520" font-weight="700" fill="#f5a623">MISSION</text>
      <text x="345" y="520" fill="#f5a623">:</text>
      <text x="365" y="520" fill="#eef1fb">Aspiring RTL Design Engineer | Exploring Electronics</text>
      <rect x="990" y="507" width="9" height="16" fill="#f5a623">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="40" y="574" font-size="13" fill="#5a648c">// crafted with curiosity &amp; circuits</text>
    <text x="1030" y="574" font-size="13" fill="#5a648c" text-anchor="end">~ vineethkumarjr</text>
  </g>

  <rect x="1.25" y="1.25" width="1102.5" height="607.5" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>
  <rect x="1.25" y="1.25" width="1102.5" height="607.5" rx="17" fill="none" stroke="#5ec8f8" stroke-opacity="0.12" stroke-width="1"/>
</svg>
