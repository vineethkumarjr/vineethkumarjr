<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BC9"/>
      <stop offset="30%" stop-color="#C79BC4"/>
      <stop offset="60%" stop-color="#E5B4BE"/>
      <stop offset="100%" stop-color="#F3D1BE"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="12" fill="url(#bgGrad)"/>
  <text x="48" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#241547">About me</text>

  <rect x="48" y="70" width="0" height="3" rx="1.5" fill="#4B2E6B">
    <animate attributeName="width" from="0" to="90" begin="0.1s" dur="0.6s" fill="freeze"/>
  </rect>

  <g transform="translate(-40,0)" opacity="0">
    <text x="88" y="118" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#3A2258">
      🎓 ECE Undergraduate
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" begin="0.4s" dur="0.55s" fill="freeze"/>
  </g>

  <g transform="translate(-40,0)" opacity="0">
    <text x="88" y="166" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#3A2258">
      💻 Passionate about VLSI and Chip Design
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="0.72s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" begin="0.72s" dur="0.55s" fill="freeze"/>
  </g>

  <g transform="translate(-40,0)" opacity="0">
    <text x="88" y="214" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#3A2258">
      🔌 Deeply interested in IoT and Embedded Systems
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="1.04s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" begin="1.04s" dur="0.55s" fill="freeze"/>
  </g>

  <g transform="translate(-40,0)" opacity="0">
    <text x="88" y="262" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#3A2258">
      🧠 Exploring Digital Electronics, CMOS Technology, and Semiconductor Fundamentals
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="1.36s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" begin="1.36s" dur="0.55s" fill="freeze"/>
  </g>

  <g transform="translate(-40,0)" opacity="0">
    <text x="88" y="310" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#3A2258">
      🚀 Constantly learning , building and improving my technical skills
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="1.68s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" begin="1.68s" dur="0.55s" fill="freeze"/>
  </g>
</svg>
