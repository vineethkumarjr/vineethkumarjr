<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BC9"/>
      <stop offset="30%" stop-color="#C79BC4"/>
      <stop offset="60%" stop-color="#E5B4BE"/>
      <stop offset="100%" stop-color="#F3D1BE"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="12" fill="url(#bgGrad)"/>
  <text x="48" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#241547">⚡ About me</text>

  <g>
    <text x="88" y="112" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#3A2258" opacity="0">
      🎓 ECE undergraduate, passionate about hardware and embedded intelligence
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" begin="0.2s" dur="0.6s" fill="freeze"/>
    </text>
  </g>

  <g>
    <text x="88" y="160" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#3A2258" opacity="0">
      🔬 Deep interest in VLSI design and digital electronics
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" begin="0.8s" dur="0.6s" fill="freeze"/>
    </text>
  </g>

  <g>
    <text x="88" y="208" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#3A2258" opacity="0">
      🤖 Exploring IoT and embedded systems development
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" begin="1.4s" dur="0.6s" fill="freeze"/>
    </text>
  </g>

  <g>
    <text x="88" y="256" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#3A2258" opacity="0">
      🌱 Constantly learning at the intersection of hardware and software
      <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" begin="2.0s" dur="0.6s" fill="freeze"/>
    </text>
