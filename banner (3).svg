<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="30%" stop-color="#050b1a"/>
      <stop offset="55%" stop-color="#0a1a3d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="revealClip">
      <rect x="0" y="0" width="0" height="240">
        <animate attributeName="width" from="0" to="900" dur="1.6s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="240" fill="url(#bgGrad)"/>

  <path d="M 40 55 Q 450 15 860 45" fill="none" stroke="#5b9dff" stroke-width="1.5" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="2s" begin="0.1s" fill="freeze"/>
  </path>
  <circle cx="770" cy="25" r="3" fill="#5b9dff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="35" r="2.5" fill="#5b9dff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <g clip-path="url(#revealClip)">
    <text x="450" y="128" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" letter-spacing="8" fill="#ffffff" filter="url(#glow)">VINEETH KUMAR J R</text>
  </g>

  <path d="M 40 195 Q 450 235 860 205" fill="none" stroke="#5b9dff" stroke-width="1.5" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="2s" begin="0.35s" fill="freeze"/>
  </path>
  <circle cx="250" cy="222" r="2.5" fill="#5b9dff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="215" r="3" fill="#5b9dff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.3s" repeatCount="indefinite"/>
  </circle>

  <line x1="40" y1="165" x2="860" y2="165" stroke="#12234a" stroke-width="1"/>
  <line x1="40" y1="210" x2="860" y2="210" stroke="#12234a" stroke-width="1"/>
  <clipPath id="marqueeClip">
    <rect x="0" y="165" width="900" height="45"/>
  </clipPath>
  <g clip-path="url(#marqueeClip)">
    <text x="900" y="193" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="600" fill="#ffffff">
      ECE undergraduate| Passionate about VLSI | digital electronics | IOT and embedded systems
      <animate attributeName="x" from="900" to="-900" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
